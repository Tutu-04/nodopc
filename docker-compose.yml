services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-raiz-solo-para-desarrollo}
      MYSQL_DATABASE: tienda_hardware
      MYSQL_USER: nodopc
      MYSQL_PASSWORD: ${DB_PASSWORD:-nodopc}
    ports:
      - '3307:3306'
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'nodopc', '-p${DB_PASSWORD:-nodopc}']
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: nodopc
      DB_PASSWORD: ${DB_PASSWORD:-nodopc}
      DB_NAME: tienda_hardware
      JWT_SECRET: ${JWT_SECRET:-clave-solo-para-desarrollo-cambiala-en-produccion}
      MINUTOS_PARA_PAGAR: ${MINUTOS_PARA_PAGAR:-30}
      PAGO_SIMULADO: ${PAGO_SIMULADO:-true}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      API_PUBLICA_URL: ${API_PUBLICA_URL:-}
    ports:
      - '3000:3000'
    volumes:
      - imagenes:/app/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos-mysql:
  imagenes:
